<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ალექსანდრეს ვებგვერდი</title>
  </head>
  <body>
    <header class="header">
    </header>
      <form style="display: flex; box-sizing: border-box; box-shadow: 3cap; background-color: aliceblue; border: 2px solid black; border-radius: 12px; padding: 32px; flex-direction: column; margin: 0 auto; width: 25%; gap: 14px;">
        <h1 style="align-self: center;" class="heading">მოგესალმებით!</h1>
        <input type="text" placeholder="ჩაწერეთ თქვენი სახელი" />
        <input type="email" placeholder="ჩაწერეთ თქვენი ელფოსტა" />
        <input type="password" placeholder="ჩაწერეთ თქვენი პაროლი" />
        <input type="submit" value="დაადასტურე" />
        <textarea name="textarea" id="textarea" cols="30" rows="10"></textarea>
      </form>
  </body>
</html>
